[package]
name = "rookiepy"
version = "0.5.6"
edition = "2021"

[lib]
name = "rookiepy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "eyre"] }
pyo3-log = "0.13"

[target.'cfg(windows)'.dependencies]
rookie = { path = "../../rookie-rs", version = "0.5.6", features = ["appbound"] }

[target.'cfg(unix)'.dependencies]
rookie = { path = "../../rookie-rs", version = "0.5.6" }
